<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Taskealo</title>
    <style>
        body {
            background-color: #ecf0f1; /* Color de fondo suave */
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            border: 2px solid #2c3e50; /* Color de contorno */
            border-radius: 8px;
            padding: 20px;
            background-color: white; /* Fondo blanco para el formulario */
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px; /* Ancho fijo */
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #2c3e50; /* Color del encabezado */
        }
        label {
            display: block;
            margin: 10px 0 5px;
            text-align: left; /* Alinear a la izquierda */
            color: #2c3e50; /* Color de las etiquetas */
        }
        input {
            width: calc(100% - 20px); /* Resta del padding */
            padding: 10px;
            margin: 5px 0 15px;
            border: 1px solid #2c3e50; /* Borde con el color de contorno */
            border-radius: 5px;
        }
        button {
            background-color: #2c3e50; /* Botón con el color especificado */
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s; /* Efecto de transición */
        }
        button:hover {
            background-color: #34495e; /* Color más claro al pasar el ratón */
        }
        a {
            color: #2980b9; /* Color de los enlaces */
            text-decoration: none; /* Sin subrayado */
            display: block; /* Para que el enlace ocupe toda la línea */
            margin-top: 15px; /* Espaciado superior */
        }
        a:hover {
            text-decoration: underline; /* Subrayado al pasar el ratón */
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="src/img/logo.png" alt="Logo Taskealo" style="max-width: 80%; height: auto; margin-bottom: 20px;">
        <form action="login.php" method="POST">
            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" name="usuario" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Iniciar</button>
        </form>
    </div>
</body>
</html>
