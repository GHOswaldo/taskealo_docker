version: '3.8'

services:
  db_master:
    image: mariadb:10.5  # Imagen de MariaDB
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: taskealo
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # Inicialización
    command: --server-id=1 --log-bin=mariadb-bin  # Configuración para replicación

  db_slave1:
    image: mariadb:10.5  # Imagen de MariaDB
    environment:
      MYSQL_ROOT_PASSWORD: 12345
    ports:
      - "3307:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # Inicialización
    command: --server-id=2 --relay-log=relay-log-bin

  db_slave2:
    image: mariadb:10.5  # Imagen de MariaDB
    environment:
      MYSQL_ROOT_PASSWORD: 12345
    ports:
      - "3308:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # Inicialización
    command: --server-id=3 --relay-log=relay-log-bin

  php-apache:
    build: .  # Esto indicará que use el Dockerfile en el directorio actual
    ports:
      - "8080:80"
    volumes:
      - ./public_html:/var/www/html

  nginx:
    image: nginx:latest
    ports:
      - "3309:3306"  # Puerto para conexiones
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf  # Archivo de configuración de Nginx
    command: /bin/bash -c "nginx -t && nginx -g 'daemon off;'"
